name: windows-ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-publish:
    name: Build, test, publish EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build solution
        run: dotnet build OpenClicky.sln -c Release

      - name: Unit tests
        run: dotnet test tests/OpenClicky.Core.Tests/OpenClicky.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Capture smoke (WGC or GDI on runner)
        # Rebuilds if needed; CI runners are non-interactive — GDI fallback is an acceptable PASS.
        run: dotnet run --project apps/windows/OpenClicky.Capture.Smoke/OpenClicky.Capture.Smoke.csproj -c Release --no-launch-profile

      - name: Publish self-contained win-x64 EXE (unsigned)
        run: powershell -ExecutionPolicy Bypass -File scripts/publish-exe.ps1

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclicky-win-x64
          path: artifacts/exe/win-x64/
          if-no-files-found: error
          retention-days: 14
